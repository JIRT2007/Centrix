[general]
live_config_reload = true

[window]
dimensions = { columns = 100, lines = 25 }
padding = { x = 15, y = 15 }
opacity = 0.97

decorations = "None"
title = ""
decorations_theme_variant = "Dark"

[scrolling]
history = 1000

[cursor]
style = { shape = "Block", blinking = "Always" }

[font]
size = 12.0
normal = { family = "JetBrains Mono", style = "Regular" }
bold = { style = "Bold" }
italic = { style = "Italic" }
bold_italic = { style = "Bold Italic" }

[font.offset]
x = -1
y = -2

[colors]
	[colors.primary] 
	foreground = "#A9B1D6"
	background = "#13131A"

	[colors.selection]
	text = "CellForeground"
	background = "#262626" 

#########################
